<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Știri 3DExposed</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#14171c;--muted:#667085;--line:#e3e6eb;--accent:#e8431f;--warm:#b97700;--chip:#e9ecf1}
:root[data-theme="dark"]{--bg:#0d1015;--card:#161a21;--text:#e8ebf0;--muted:#8a93a3;--line:#252b35;--accent:#ff6a45;--warm:#f0b429;--chip:#1e242d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:780px;margin:0 auto;padding:0 16px 60px}
header{display:flex;align-items:center;gap:12px;padding:18px 0 10px}
h1{font-size:1.3rem;margin:0;flex:1;letter-spacing:-.01em}
h1 span{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
#theme{font-size:1.2rem;padding:6px 10px;border-radius:10px;background:var(--chip)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--text);border-color:var(--accent)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{white-space:nowrap;padding:7px 14px;border-radius:999px;background:var(--chip);font-size:.9rem}
.chips button.on{background:var(--accent);color:#fff;font-weight:600}
.sort{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.85rem;color:var(--muted)}
.sort button{padding:4px 10px;border-radius:8px;color:var(--muted)}
.sort button.on{background:var(--chip);color:var(--text);font-weight:600}
.card{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.score{flex:none;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:1.05rem;background:var(--chip);color:var(--muted)}
.score.hi{background:var(--accent);color:#fff}
.score.mid{background:transparent;color:var(--warm);box-shadow:inset 0 0 0 2px var(--warm)}
.body{min-width:0;flex:1}
a{color:inherit}
.title{font-weight:650;font-size:1.02rem;text-decoration:none;display:block;overflow-wrap:anywhere}
.title:hover{text-decoration:underline}
.meta{font-size:.82rem;color:var(--muted);margin-top:4px}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);font-size:.75rem;margin-right:4px}
.desc{margin:8px 0 0;font-size:.92rem;color:var(--muted);overflow-wrap:anywhere}
details{margin-top:8px;font-size:.82rem;color:var(--muted)}
summary{cursor:pointer}
details a{margin-right:10px}
h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 4px}
.when{flex:none;width:58px;text-align:center;border-radius:12px;background:var(--chip);padding:6px 2px;align-self:flex-start}
.when b{display:block;font-size:1.25rem;line-height:1.1}
.when small{font-size:.72rem;color:var(--muted);text-transform:uppercase}
.approx{display:inline-block;padding:1px 8px;border-radius:999px;font-size:.75rem;color:var(--warm);box-shadow:inset 0 0 0 1px var(--warm);margin-right:4px}
.quote{margin:8px 0 0;padding-left:10px;border-left:3px solid var(--line);font-size:.88rem;color:var(--muted);font-style:italic;overflow-wrap:anywhere}
.empty{text-align:center;color:var(--muted);padding:40px 0}
footer{margin-top:30px;font-size:.8rem;color:var(--muted);text-align:center}
</style>
<script>
(function(){var t;try{t=localStorage.getItem('theme')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=t})();
</script>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Știri <span>3DExposed</span></h1>
    <button id="theme" title="Temă închisă / deschisă" aria-label="Schimbă tema">◐</button>
  </header>
  <nav class="tabs">
    <button data-tab="news" class="on">Știri</button>
    <button data-tab="upcoming">Upcoming</button>
  </nav>
  <div class="bar">
    <div class="chips" id="chips"></div>
    <div class="sort" id="sort">Sortare:
      <button data-sort="score" class="on">Scor</button>
      <button data-sort="new">Cele mai noi</button>
    </div>
  </div>
  <main id="list"></main>
  <footer id="foot"></footer>
</div>
<script>
const D = /*DATA*/null || {news:[],upcoming:[],errors:[],updated:null};
const CATS = ['Toate','Tech','Mașini','Spațiu','Construcții','Viral'];
const S = {tab:'news',cat:'Toate',sort:'score'};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safe = u => /^https?:\/\//.test(u) ? esc(u) : '#';

function ago(iso){
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return `acum ${m} min`;
  if (m < 1440) return `acum ${Math.round(m/60)} h`;
  const d = Math.round(m/1440); return `acum ${d} ${d === 1 ? 'zi' : 'zile'}`;
}
// "2026-11-18" -> data locala; ISO cu ora -> momentul exact
function toDate(s){
  if (s.length <= 10) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
  return new Date(s);
}
const tags = c => (c || []).map(x => `<span class="tag">${esc(x)}</span>`).join('');

function renderNews(){
  let a = D.news.filter(n => S.cat === 'Toate' || n.c.includes(S.cat));
  a = a.slice().sort(S.sort === 'score' ? (x,y) => y.sc - x.sc || y.w.localeCompare(x.w) : (x,y) => y.w.localeCompare(x.w));
  if (!a.length) return '<p class="empty">Nicio știre aici deocamdată.</p>';
  return a.map(n => {
    const more = (n.y.length || n.o.length) ? `<details><summary>De ce scorul ăsta${n.o.length ? ` · ${n.o.length + 1} surse` : ''}</summary>
      ${n.y.length ? `<div>${esc(n.y.join('  '))}</div>` : ''}
      ${n.o.length ? `<div>${n.o.map(o => `<a href="${safe(o.u)}" target="_blank" rel="noopener">${esc(o.s)}</a>`).join('')}</div>` : ''}</details>` : '';
    return `<article class="card">
      <div class="score ${n.sc >= 70 ? 'hi' : n.sc >= 40 ? 'mid' : ''}" title="Scor">${n.sc}</div>
      <div class="body">
        <a class="title" href="${safe(n.u)}" target="_blank" rel="noopener">${esc(n.t)}</a>
        <div class="meta">${esc(n.s)} · ${ago(n.w)} · ${tags(n.c)}</div>
        ${n.d ? `<p class="desc">${esc(n.d)}</p>` : ''}${more}
      </div></article>`;
  }).join('');
}

function renderUpcoming(){
  const now = new Date(), today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const endToday = new Date(+today + 864e5);
  const endWeek = new Date(+today + (8 - (today.getDay() || 7)) * 864e5);
  const endMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const groups = [['Azi',[]],['Săptămâna asta',[]],['Luna asta',[]],['Mai târziu',[]]];
  D.upcoming.filter(e => S.cat === 'Toate' || e.c.includes(S.cat)).forEach(e => {
    const d = toDate(e.date);
    if (d < today) return;                       // evenimentele trecute dispar
    groups[d < endToday ? 0 : d < endWeek ? 1 : d < endMonth ? 2 : 3][1].push([d, e]);
  });
  const out = groups.filter(g => g[1].length).map(([name, list]) => `<h2>${name}</h2>` + list.map(([d, e]) => {
    const hasTime = e.date.length > 10;
    const time = hasTime ? d.toLocaleTimeString('ro-RO', {hour:'2-digit', minute:'2-digit'}) : '';
    return `<article class="card">
      <div class="when"><b>${e.approx ? '≈' : d.getDate()}</b><small>${d.toLocaleDateString('ro-RO', {month:'short'})}${d.getFullYear() !== now.getFullYear() ? ' ' + d.getFullYear() : ''}</small></div>
      <div class="body">
        <a class="title" href="${safe(e.u)}" target="_blank" rel="noopener">${esc(e.t)}</a>
        <div class="meta">${e.approx ? `<span class="approx">≈ dată aproximativă${e.label ? ': ' + esc(e.label) : ''}</span>` : ''}${time ? `ora ${time} · ` : ''}${esc(e.s)} ${tags(e.c)}</div>
        ${e.phrase ? `<p class="quote">${e.src === 'news' ? '„' + esc(e.phrase) + '”' : esc(e.phrase)}</p>` : ''}
      </div></article>`;
  }).join('')).join('');
  return out || '<p class="empty">Niciun eveniment aici deocamdată.</p>';
}

function render(){
  $('chips').innerHTML = CATS.map(c => `<button data-cat="${c}" class="${c === S.cat ? 'on' : ''}">${c}</button>`).join('');
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('on', b.dataset.sort === S.sort));
  $('sort').style.display = S.tab === 'news' ? '' : 'none';
  $('list').innerHTML = S.tab === 'news' ? renderNews() : renderUpcoming();
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.tab) S.tab = b.dataset.tab;
  else if (b.dataset.cat) S.cat = b.dataset.cat;
  else if (b.dataset.sort) S.sort = b.dataset.sort;
  else if (b.id === 'theme') {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    try { localStorage.setItem('theme', t); } catch (e) {}
    return;
  } else return;
  render(); window.scrollTo(0, 0);
});
$('foot').innerHTML = (D.updated ? `Actualizat ${ago(D.updated)} (${new Date(D.updated).toLocaleString('ro-RO', {dateStyle:'short', timeStyle:'short'})})` : '')
  + (D.errors.length ? `<br>Surse care n-au răspuns acum: ${esc(D.errors.join(', '))}` : '');
render();
</script>
</body>
</html>
