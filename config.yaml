# ---------------- UPCOMING ----------------
upcoming:
  lansari_spatiale: 40          # cate lansari cerem de la Launch Library 2 (o singura cerere pe ora)
  spatiu_ignora: [Starlink]     # lansari de rutina pe care nu le vrem
