# ---------------- SURSE ----------------
# tip: rss = flux obisnuit | google = Google News | hn = Hacker News
# Ca sa scoti o sursa: sterge cele 4 randuri ale ei (sau pune # in fata lor).
surse:
  # --- Tech ---
  - nume: The Verge
    tip: rss
    categorie: Tech
    url: https://www.theverge.com/rss/index.xml
  - nume: TechCrunch
    tip: rss
    categorie: Tech
    url: https://techcrunch.com/feed/
  - nume: Ars Technica
    tip: rss
    categorie: Tech
    url: https://feeds.arstechnica.com/arstechnica/index
  - nume: Hacker News
    tip: hn
    categorie: [Tech, Viral]
    max: 40

  # --- Masini ---
  - nume: Electrek
    tip: rss
    categorie: Mașini
    url: https://electrek.co/feed/
  - nume: InsideEVs
    tip: rss
    categorie: Mașini
    url: https://insideevs.com/rss/news/all/
  - nume: Motor1
    tip: rss
    categorie: Mașini
    url: https://www.motor1.com/rss/news/all/

  # --- Spatiu ---
  - nume: Space.com
    tip: rss
    categorie: Spațiu
    url: https://www.space.com/feeds/all
  - nume: SpaceNews
    tip: rss
    categorie: Spațiu
    url: https://spacenews.com/feed/

  # --- Constructii ---
  - nume: New Atlas
    tip: rss
    categorie: Construcții
    url: https://newatlas.com/index.rss
  - nume: Dezeen
    tip: rss
    categorie: Construcții
    url: https://www.dezeen.com/feed/
  - nume: Designboom
    tip: rss
    categorie: Construcții
    url: https://www.designboom.com/feed/

  # --- Viral (Google News) ---
  - nume: Google News
    tip: google
    categorie: Viral
    url: https://news.google.com/rss?hl=en-US&gl=US&ceid=US:en
  - nume: Google News
    tip: google
    categorie: Viral
    url: https://news.google.com/rss/search?q=unveils+OR+unveiled+OR+%22first+ever%22+when:1d&hl=en-US&gl=US&ceid=US:en
  - nume: Google News
    tip: google
    categorie: Viral
    url: https://news.google.com/rss/search?q=%22world%27s+largest%22+OR+%22world%27s+fastest%22+OR+%22world+record%22+when:2d&hl=en-US&gl=US&ceid=US:en
