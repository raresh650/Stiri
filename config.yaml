# ============================================================
#  CONFIGURARE STIRI 3DEXPOSED
#  Aici schimbi sursele, cuvintele si ponderile.
#  Atentie la spatiile de la inceputul randurilor (conteaza!).
# ============================================================

setari:
  max_ore: 48              # stirile mai vechi de atat dispar
  max_stiri: 250           # cate stiri apar cel mult pe pagina
  scor_minim: 10           # stirile sub acest scor nu apar
  prag_asemanare: 0.6      # 0-1: cat de asemanatoare sa fie titlurile ca sa fie socotite aceeasi stire

# ---------------- SCORUL "CAT DE TARE E" (0-100) ----------------
scor:
  prospetime_max: 25                 # puncte pentru o stire abia aparuta
  prospetime_injumatatire_ore: 12    # dupa atatea ore, punctele de prospetime se injumatatesc
  puncte_per_sursa_extra: 12         # pentru fiecare sursa in plus care scrie despre acelasi subiect
  surse_max: 36
  hn_per_punct_pe_ora: 0.4           # Hacker News: puncte pe ora x aceasta valoare
  hn_max: 30
  cuvinte_bune_max: 40               # plafon pentru cuvintele bune

# Cuvinte potrivite pentru un video 3D (cuvant: puncte).
# Se potrivesc si formele cu -s, -ed, -ing (unveil = unveils, unveiled...).
